[server]
listen = "127.0.0.1:8787"

[auth]
api_key_env = "TUXBRIDGE_API_KEY"

[security]
# default | loose | i_want_to_nuke_my_server
profile = "default"
default_command_allowlist = ["pwd", "ls", "cat", "head", "tail", "wc", "grep", "stat", "du", "df", "uname", "id", "whoami"]

[approvals]
# Exact protected API paths. When a request hits one of these without a consumed
# approval token TuxBridge returns HTTP 428 with an approval_id. Approve it in
# Mission Control and retry with X-TuxBridge-Approval-Id.
# Good candidates in unrestricted profiles:
# required_paths = ["/v1/git/push", "/v1/commands/raw"]
required_paths = []

[limits]
max_body_bytes = 10485760
max_in_flight = 32
command_timeout_seconds = 120
max_command_timeout_seconds = 900
command_output_bytes = 2097152
max_jobs = 128
job_retention_seconds = 3600

# TuxBridge has built-in executable mappings for rust-analyzer, gopls,
# typescript-language-server, pyright-langserver, intelephense, jdtls, and
# kotlin-language-server. Add/override servers here when you want custom argv,
# extensions, language IDs, or initialization options.
#
# [lsp.servers.clangd]
# enabled = true
# argv = ["clangd", "--background-index", "--clang-tidy"]
# extensions = ["c", "h", "cc", "cpp", "cxx", "hpp"]
# language_id = "cpp"
#
# [lsp.servers.vue]
# enabled = true
# argv = ["vue-language-server", "--stdio"]
# extensions = ["vue"]
# language_id = "vue"
#
# Initialization options may be expressed as nested TOML tables, e.g.
# [lsp.servers.example.initialization_options]
# someFlag = true

[workspaces.example]
root = "/absolute/path/to/workspace"

[workspaces.example.capabilities]
fs_read = true
fs_write = false
commands = false
git_read = true
git_write = false
git_network = false

[user_files.documents]
root = "/absolute/path/to/documents"
read = true
write = false

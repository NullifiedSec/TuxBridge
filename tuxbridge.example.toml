[server]
listen = "127.0.0.1:8787"

[auth]
api_key_env = "TUXBRIDGE_API_KEY"

[security]
# default | loose | i_want_to_nuke_my_server
profile = "default"
default_command_allowlist = ["pwd", "ls", "find", "cat", "head", "tail", "wc", "grep", "rg", "git", "cargo", "rustc", "node", "npm", "bun", "go", "python3"]

[limits]
max_body_bytes = 10485760
max_in_flight = 32
command_timeout_seconds = 120
max_command_timeout_seconds = 900
command_output_bytes = 2097152
max_jobs = 128
job_retention_seconds = 3600

[workspaces.example]
root = "/absolute/path/to/workspace"

[workspaces.example.capabilities]
fs_read = true
fs_write = false
commands = false
git_read = true
git_write = false
git_network = false

# Separate, explicitly exposed user filesystem mount.
# It never grants command or Git capabilities.
[user_files.documents]
root = "/absolute/path/to/documents"
read = true
write = false

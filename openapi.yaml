openapi: 3.1.0
info:
  title: TuxBridge API
  version: 0.1.0
  description: Capability-scoped Linux host bridge for ChatGPT Actions.
servers:
  - url: https://tuxbridge.example.com
    description: Replace with the HTTPS endpoint fronting TuxBridge.
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      summary: Check whether TuxBridge is alive.
      responses: { '200': { description: Service health. } }
  /v1/system:
    get:
      operationId: getSystemInfo
      summary: Inspect safe host metadata and development-tool availability.
      responses: { '200': { description: System information. } }
  /v1/system/tool-versions:
    get:
      operationId: getToolVersions
      summary: Probe bounded version output for common development tools.
      responses: { '200': { description: Tool availability and versions. } }
  /v1/system/processes:
    get:
      operationId: listProcesses
      summary: List bounded process metadata without command lines or environment variables.
      responses: { '200': { description: Process metadata. } }
  /v1/system/listeners:
    get:
      operationId: listTcpListeners
      summary: List TCP listening sockets without process command lines.
      responses: { '200': { description: TCP listeners. } }
  /v1/system/disks:
    get:
      operationId: getDiskUsage
      summary: Inspect mounted filesystem capacity and free space.
      responses: { '200': { description: Filesystem usage. } }
  /v1/doctor:
    get:
      operationId: runDoctor
      summary: Diagnose tools, limits, service-user safety, workspaces, mounts, and Git readiness.
      responses: { '200': { description: Diagnostic report. } }
  /v1/workspaces:
    get:
      operationId: listWorkspaces
      summary: List configured workspaces and capabilities.
      responses: { '200': { description: Workspace summaries. } }
  /v1/workspaces/{name}:
    get:
      operationId: getWorkspace
      summary: Inspect one configured workspace.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: Workspace metadata. } }
  /v1/workspaces/resolve:
    post:
      operationId: resolveWorkspacePath
      summary: Safely resolve an existing workspace-relative path.
      requestBody: { $ref: '#/components/requestBodies/PathRequestBody' }
      responses: { '200': { description: Resolved path metadata. } }
  /v1/workspaces/tree-summary:
    post:
      operationId: summarizeWorkspaceTree
      summary: Count bounded files, directories, symlinks, and bytes without following symlinks.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TreeSummaryRequest' }
      responses: { '200': { description: Tree summary. } }
  /v1/fs/list:
    post:
      operationId: listDirectory
      summary: List a readable workspace directory.
      requestBody: { $ref: '#/components/requestBodies/PathRequestBody' }
      responses: { '200': { description: Directory entries. } }
  /v1/fs/stat:
    post:
      operationId: statPath
      summary: Stat a readable workspace path.
      requestBody: { $ref: '#/components/requestBodies/PathRequestBody' }
      responses: { '200': { description: Path metadata. } }
  /v1/fs/read:
    post:
      operationId: readFile
      summary: Read bounded UTF-8 text from a workspace file.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReadRequest' }
      responses: { '200': { description: File content and metadata. } }
  /v1/fs/read-batch:
    post:
      operationId: readFiles
      summary: Read multiple workspace files with per-file partial success.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchReadRequest' }
      responses: { '200': { description: Batch read results. } }
  /v1/fs/search:
    post:
      operationId: searchFiles
      summary: Search bounded UTF-8 workspace files without following symlinks.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchRequest' }
      responses: { '200': { description: Search matches. } }
  /v1/fs/hash:
    post:
      operationId: hashFile
      summary: Compute a full-file SHA-256 before mutation.
      requestBody: { $ref: '#/components/requestBodies/FileIdentityRequestBody' }
      responses: { '200': { description: File hash and size. } }
  /v1/fs/write:
    post:
      operationId: writeFile
      summary: Atomically create or hash-guardedly replace a workspace UTF-8 file.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WriteRequest' }
      responses:
        '200': { description: Mutation result. }
        '409': { description: Existing target or stale expected hash. }
  /v1/fs/patch:
    post:
      operationId: patchFile
      summary: Hash-guardedly replace exactly one text occurrence.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchRequest' }
      responses:
        '200': { description: Mutation result. }
        '409': { description: Hash mismatch or ambiguous patch. }
  /v1/user-files:
    get:
      operationId: listUserFileMounts
      summary: List separately configured user-files mounts.
      responses: { '200': { description: Mount summaries. } }
  /v1/user-files/list:
    post:
      operationId: listUserDirectory
      summary: List a readable user-files directory.
      requestBody: { $ref: '#/components/requestBodies/UserPathRequestBody' }
      responses: { '200': { description: Directory entries. } }
  /v1/user-files/stat:
    post:
      operationId: statUserPath
      summary: Stat a readable user-files path.
      requestBody: { $ref: '#/components/requestBodies/UserPathRequestBody' }
      responses: { '200': { description: Path metadata. } }
  /v1/user-files/read:
    post:
      operationId: readUserFile
      summary: Read bounded UTF-8 text from a user-files mount.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserReadRequest' }
      responses: { '200': { description: File content and metadata. } }
  /v1/user-files/hash:
    post:
      operationId: hashUserFile
      summary: Compute a full-file SHA-256 in a user-files mount.
      requestBody: { $ref: '#/components/requestBodies/UserPathRequestBody' }
      responses: { '200': { description: File hash and size. } }
  /v1/user-files/write:
    post:
      operationId: writeUserFile
      summary: Atomically create or hash-guardedly replace a user file.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserWriteRequest' }
      responses: { '200': { description: Mutation result. } }
  /v1/user-files/patch:
    post:
      operationId: patchUserFile
      summary: Hash-guardedly patch exactly one occurrence in a user file.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserPatchRequest' }
      responses: { '200': { description: Mutation result. } }
  /v1/project/inspect:
    post:
      operationId: inspectProject
      summary: Detect common project manifests, package managers, and top-level structure.
      requestBody: { $ref: '#/components/requestBodies/WorkspaceRequestBody' }
      responses: { '200': { description: Project inspection. } }
  /v1/commands/run:
    post:
      operationId: runCommand
      summary: Run one argv-based command in a command-enabled workspace.
      description: Available in loose and i_want_to_nuke_my_server profiles; blocked by the default profile.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommandRequest' }
      responses:
        '200': { description: Command result. }
        '403': { description: Blocked by the default security profile. }
  /v1/commands/raw:
    post:
      operationId: runRawCommand
      summary: Run a profile-aware command string in a command-enabled workspace.
      description: Default accepts only simple allowlisted commands with shell grammar rejected. Loose and i_want_to_nuke_my_server execute through /bin/bash --noprofile --norc -lc as the TuxBridge service user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RawCommandRequest' }
      responses:
        '200': { description: Command result including active profile. }
        '403': { description: Command or program blocked by the active profile. }
  /v1/commands/start:
    post:
      operationId: startCommand
      summary: Start a bounded cancellable background command.
      description: Available in loose and i_want_to_nuke_my_server profiles; blocked by the default profile.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommandRequest' }
      responses:
        '200': { description: Initial job snapshot. }
        '403': { description: Blocked by the default security profile. }
  /v1/jobs/{id}:
    get:
      operationId: getCommandJob
      summary: Inspect a background command job.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: Job snapshot. } }
    delete:
      operationId: cancelCommandJob
      summary: Request cancellation of a running background command job.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: Job snapshot. } }
  /v1/git/status:
    post:
      operationId: gitStatus
      summary: Return structured Git working-tree status.
      requestBody: { $ref: '#/components/requestBodies/WorkspaceRequestBody' }
      responses: { '200': { description: Git status. } }
  /v1/git/branches:
    post:
      operationId: gitBranches
      summary: List local branches, SHAs, upstreams, and current state.
      requestBody: { $ref: '#/components/requestBodies/WorkspaceRequestBody' }
      responses: { '200': { description: Branches. } }
  /v1/git/head:
    post:
      operationId: gitHead
      summary: Inspect HEAD SHA, current branch, upstream, and repository root.
      requestBody: { $ref: '#/components/requestBodies/WorkspaceRequestBody' }
      responses: { '200': { description: HEAD metadata. } }
  /v1/git/remotes:
    post:
      operationId: gitRemotes
      summary: List Git remotes with fetch and push URLs.
      requestBody: { $ref: '#/components/requestBodies/WorkspaceRequestBody' }
      responses: { '200': { description: Git remotes. } }
  /v1/git/stashes:
    post:
      operationId: gitStashes
      summary: List stash references and subjects without mutating them.
      requestBody: { $ref: '#/components/requestBodies/WorkspaceRequestBody' }
      responses: { '200': { description: Stash entries. } }
  /v1/git/log:
    post:
      operationId: gitLog
      summary: Read recent Git history.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitLogRequest' }
      responses: { '200': { description: Commit history. } }
  /v1/git/diff:
    post:
      operationId: gitDiff
      summary: Read a bounded staged or unstaged diff.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitDiffRequest' }
      responses: { '200': { description: Diff content. } }
  /v1/git/fetch:
    post:
      operationId: gitFetch
      summary: Fetch configured remotes and prune stale refs.
      requestBody: { $ref: '#/components/requestBodies/WorkspaceRequestBody' }
      responses: { '200': { description: Git result. } }
  /v1/git/pull:
    post:
      operationId: gitPull
      summary: Pull only when the worktree is clean and fast-forward is possible.
      requestBody: { $ref: '#/components/requestBodies/WorkspaceRequestBody' }
      responses:
        '200': { description: Git result. }
        '409': { description: Dirty worktree. }
  /v1/git/add:
    post:
      operationId: gitAdd
      summary: Stage explicit repository-relative paths.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitAddRequest' }
      responses: { '200': { description: Git result. } }
  /v1/git/commit:
    post:
      operationId: gitCommit
      summary: Commit staged changes with an explicit message and disabled hooks.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitCommitRequest' }
      responses: { '200': { description: Git result. } }
  /v1/git/push:
    post:
      operationId: gitPush
      summary: Non-force push one validated local branch to an existing remote.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitPushRequest' }
      responses: { '200': { description: Git result. } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  requestBodies:
    WorkspaceRequestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkspaceRequest' }
    PathRequestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PathRequest' }
    FileIdentityRequestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FileIdentityRequest' }
    UserPathRequestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/UserPathRequest' }
  schemas:
    WorkspaceRequest:
      type: object
      additionalProperties: false
      required: [workspace]
      properties:
        workspace: { type: string, minLength: 1 }
    PathRequest:
      type: object
      additionalProperties: false
      required: [workspace]
      properties:
        workspace: { type: string, minLength: 1 }
        path: { type: string, default: '' }
    FileIdentityRequest:
      type: object
      additionalProperties: false
      required: [workspace, path]
      properties:
        workspace: { type: string, minLength: 1 }
        path: { type: string, minLength: 1 }
    TreeSummaryRequest:
      type: object
      additionalProperties: false
      required: [workspace]
      properties:
        workspace: { type: string, minLength: 1 }
        max_depth: { type: integer, minimum: 0, maximum: 12, default: 4 }
        max_entries: { type: integer, minimum: 1, maximum: 100000, default: 20000 }
    ReadSpec:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path: { type: string, minLength: 1 }
        start_line: { type: integer, minimum: 1 }
        end_line: { type: integer, minimum: 1 }
        max_bytes: { type: integer, minimum: 1, maximum: 8388608 }
    ReadRequest:
      type: object
      additionalProperties: false
      required: [workspace, path]
      properties:
        workspace: { type: string, minLength: 1 }
        path: { type: string, minLength: 1 }
        start_line: { type: integer, minimum: 1 }
        end_line: { type: integer, minimum: 1 }
        max_bytes: { type: integer, minimum: 1, maximum: 8388608 }
    BatchReadRequest:
      type: object
      additionalProperties: false
      required: [workspace, files]
      properties:
        workspace: { type: string, minLength: 1 }
        files:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: '#/components/schemas/ReadSpec' }
    SearchRequest:
      type: object
      additionalProperties: false
      required: [workspace, query]
      properties:
        workspace: { type: string, minLength: 1 }
        path: { type: string, default: '' }
        query: { type: string, minLength: 1 }
        max_results: { type: integer, minimum: 1, maximum: 1000 }
    WriteRequest:
      type: object
      additionalProperties: false
      required: [workspace, path, mode, content]
      properties:
        workspace: { type: string, minLength: 1 }
        path: { type: string, minLength: 1 }
        mode: { type: string, enum: [create, replace] }
        content: { type: string }
        expected_sha256: { type: string, minLength: 64, maxLength: 64 }
    PatchRequest:
      type: object
      additionalProperties: false
      required: [workspace, path, expected_sha256, old, new]
      properties:
        workspace: { type: string, minLength: 1 }
        path: { type: string, minLength: 1 }
        expected_sha256: { type: string, minLength: 64, maxLength: 64 }
        old: { type: string, minLength: 1 }
        new: { type: string }
    UserPathRequest:
      type: object
      additionalProperties: false
      required: [mount]
      properties:
        mount: { type: string, minLength: 1 }
        path: { type: string, default: '' }
    UserReadRequest:
      type: object
      additionalProperties: false
      required: [mount, path]
      properties:
        mount: { type: string, minLength: 1 }
        path: { type: string, minLength: 1 }
        max_bytes: { type: integer, minimum: 1, maximum: 8388608 }
    UserWriteRequest:
      type: object
      additionalProperties: false
      required: [mount, path, mode, content]
      properties:
        mount: { type: string, minLength: 1 }
        path: { type: string, minLength: 1 }
        mode: { type: string, enum: [create, replace] }
        content: { type: string }
        expected_sha256: { type: string, minLength: 64, maxLength: 64 }
    UserPatchRequest:
      type: object
      additionalProperties: false
      required: [mount, path, expected_sha256, old, new]
      properties:
        mount: { type: string, minLength: 1 }
        path: { type: string, minLength: 1 }
        expected_sha256: { type: string, minLength: 64, maxLength: 64 }
        old: { type: string, minLength: 1 }
        new: { type: string }
    CommandRequest:
      type: object
      additionalProperties: false
      required: [workspace, argv]
      properties:
        workspace: { type: string, minLength: 1 }
        argv:
          type: array
          minItems: 1
          maxItems: 256
          items: { type: string }
        timeout_seconds: { type: integer, minimum: 1, maximum: 3600 }
    RawCommandRequest:
      type: object
      additionalProperties: false
      required: [workspace, command]
      properties:
        workspace: { type: string, minLength: 1 }
        command: { type: string, minLength: 1, maxLength: 16384 }
        timeout_seconds: { type: integer, minimum: 1, maximum: 3600 }
    GitLogRequest:
      type: object
      additionalProperties: false
      required: [workspace]
      properties:
        workspace: { type: string, minLength: 1 }
        limit: { type: integer, minimum: 1, maximum: 200 }
    GitDiffRequest:
      type: object
      additionalProperties: false
      required: [workspace]
      properties:
        workspace: { type: string, minLength: 1 }
        staged: { type: boolean, default: false }
        path: { type: string }
        max_bytes: { type: integer, minimum: 1, maximum: 8388608 }
    GitAddRequest:
      type: object
      additionalProperties: false
      required: [workspace, paths]
      properties:
        workspace: { type: string, minLength: 1 }
        paths:
          type: array
          minItems: 1
          maxItems: 1024
          items: { type: string, minLength: 1 }
    GitCommitRequest:
      type: object
      additionalProperties: false
      required: [workspace, message]
      properties:
        workspace: { type: string, minLength: 1 }
        message: { type: string, minLength: 1, maxLength: 16384 }
    GitPushRequest:
      type: object
      additionalProperties: false
      required: [workspace, remote, branch]
      properties:
        workspace: { type: string, minLength: 1 }
        remote: { type: string, minLength: 1 }
        branch: { type: string, minLength: 1 }

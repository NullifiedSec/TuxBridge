[package]
name = "tuxbridge"
version = "0.1.0"
edition = "2024"
description = "A capability-scoped bridge between ChatGPT Actions and a Linux host"
license = "MIT"
repository = "https://github.com/NullifiedSec/TuxBridge"
rust-version = "1.85"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "time", "io-util", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.8"
url = "2"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
